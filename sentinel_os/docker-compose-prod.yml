version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: iceberg-postgres
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iceberg_prod_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  iceberg:
    build: .
    # Stated explicitly as of the governed-lane wiring: the Dockerfile's
    # default CMD is now api_server_v2.py (the governed ingress, port
    # 8000). This service publishes 9090 and healthchecks 9090, so
    # inheriting that default would start the wrong program on the wrong
    # port and report unhealthy forever. Naming the program here keeps
    # this file's behavior byte-identical to what it was before.
    command: ["python3", "api_server_resilient.py"]
    container_name: iceberg-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: iceberg
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iceberg_prod_password}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      # Service signing key for the ledger's authorized_by attestation
      # (governance/authorized_by_attestation.py). Unset -> rows written
      # unattested (the default). KEYS_PREVIOUS holds post-rotation old keys,
      # still trusted for verification -- see DEPLOYMENT.md "Key rotation".
      ICEBERG_LEDGER_ATTESTATION_KEY: ${ICEBERG_LEDGER_ATTESTATION_KEY:-}
      ICEBERG_LEDGER_ATTESTATION_KEYS_PREVIOUS: ${ICEBERG_LEDGER_ATTESTATION_KEYS_PREVIOUS:-}
      PORT: 9090
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: always
    healthcheck:
      # Protocol fallback (2026-08-07): api_server_resilient.py serves
      # HTTPS (self-signed cert) whenever ./certs/cert.pem + key.pem
      # exist at startup, plain HTTP otherwise -- cert presence depends
      # on the build context, not this compose file. Plain "curl http://"
      # against a TLS-serving instance fails at the handshake, never
      # reaching the app -- confirmed live against docker-compose.yml's
      # identically-shaped healthcheck (2 days reporting unhealthy on
      # every check despite /health answering fine over HTTPS). CMD-SHELL
      # (not CMD) so the || fallback runs; try HTTPS (-k: self-signed, no
      # CA to validate against) first, fall back to HTTP.
      test: ["CMD-SHELL", "curl -fsk https://localhost:9090/health || curl -fs http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  default:
    name: iceberg-prod
